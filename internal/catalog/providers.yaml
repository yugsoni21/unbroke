    note: "Web services listing at /api/webservices/list is a custom JSON, not OpenAPI."
  - name: "Stability AI, Fireworks, Together AI, dbt Cloud, Airbyte, Ory"
    note: "The usual spec locations returned 404; no verified public spec found."
  - name: "Vonage / Nexmo"
