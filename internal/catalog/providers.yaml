# Public APIs Unbroke can watch. Every spec here was fetched and parsed by `unbroke catalog verify`.
# GitHub-hosted specs (repo + path) have full change history. Specs hosted by the provider (url) are
# tracked from the first snapshot Unbroke takes.

providers:
  - id: stripe
    name: "Stripe"
    company: "Stripe"
    category: "Payments"
    specs:
      - name: "REST API"
        repo: stripe/openapi
        path: openapi/spec3.json
  - id: github
    name: "GitHub"
    company: "Microsoft (GitHub)"
    category: "Developer platform"
    specs:
      - name: "REST API"
        repo: github/rest-api-description
        path: descriptions/api.github.com/api.github.com.json
  - id: openai
    name: "OpenAI"
    notes: "The spec file was absent from the repository from 2025-06-17 until 2026-05-13, so comparisons with dates in that gap find nothing to compare."
    company: "OpenAI"
    category: "AI"
    specs:
      - name: "REST API"
        repo: openai/openai-openapi
        path: openapi.yaml
  - id: slack
    name: "Slack Web API"
    company: "Salesforce (Slack)"
    category: "Collaboration"
    notes: "Swagger 2.0. Slack archived this repository in 2021 and stopped updating the spec."
    archived: "2021-09-07"
    specs:
      - name: "REST API"
        repo: slackapi/slack-api-specs
        path: web-api/slack_web_openapi_v2.json
  - id: cloudflare
    name: "Cloudflare"
    company: "Cloudflare"
    category: "Cloud infrastructure"
    notes: "27.7 MB spec; comparisons take several seconds"
    specs:
      - name: "REST API"
        repo: cloudflare/api-schemas
        path: openapi.json
  - id: digitalocean
    name: "DigitalOcean"
    company: "DigitalOcean"
