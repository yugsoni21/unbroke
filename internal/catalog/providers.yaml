unlocated:
  - name: "Shopify"
    note: "Admin API is GraphQL-first; no REST OpenAPI located"
  - name: "Salesforce"
    note: "No stable public spec file. Commerce Cloud (SCAPI) publishes OpenAPI files, but in folders named after each release (apis/shopper-products-oas-1.13.0/), so the path changes every version; the Marketing Cloud file was last updated in 2019; the core platform API (sObjects) only has a beta spec generated per customer org; no Connect REST, Data Cloud or Agentforce file was found."
  - name: "Zoom"
    note: "The only published OpenAPI file dates from 2018 and is out of date."
  - name: "Amazon Web Services"
    note: "no first-party OpenAPI; per-service Smithy models instead"
  - name: "Google Cloud"
    note: "publishes Discovery documents and protobufs, not OpenAPI"
  - name: "Microsoft Azure"
    note: "per-service specs in a very large multi-service repository; not yet added"
  - name: "Gusto"
    note: "not located at the paths tried"
  - name: "Brex"
    note: "not located at the paths tried"
  - name: "WooCommerce"
    note: "No official OpenAPI known (REST docs hand-written; woocommerce-rest-api-docs is docs source). Only briefly checked."
  - name: "QuickBooks / Intuit"
    note: "Intuit states the QBO API is not OpenAPI compliant; only community gists exist."
  - name: "Freshworks (Freshdesk/Freshsales)"
    note: "Not checked in detail: no public spec known; likely repositories not found."
  - name: "Adobe Acrobat Sign"
    note: "adobe-sign/AdobeSign-OpenAPI json/ folder is per-resource Swagger 1.2 (not 2.0/3.x) per Adobe docs; no unified 2.0/3.x spec found."
  - name: "Klarna"
    note: "No official spec file found; only api-evangelist/APIs.guru third-party copies."
  - name: "Wise (TransferWise)"
    note: "No official OpenAPI; transferwise/api-docs is archived markdown docs. Only third-party mirrors."
  - name: "Checkout.com"
    note: "No spec found: api-reference.checkout.com/swagger.json 404, no official spec repo located."
  - name: "Rippling"
    note: "Not checked in detail: likely repositories 404, no public spec known."
  - name: "Increase"
    note: "https://api.increase.com/openapi.json returns 401 (reportedly the spec URL but needs auth); no public spec repo (Increase/increase-openapi 404). Stainless SDK repos reference hash-named spec URLs that are not stable."
  - name: "Tink"
    note: "No official spec; only community ulfsa/tink-openapi."
  - name: "TrueLayer"
    note: "No public spec found."
  - name: "Unit"
    note: "unit-finance/openapi-unit-sdk openapi.json (3.0.2, 0.02 MB) is a thin index of 117 paths with 0 inline operations ($ref to other files); not usable as a single spec."
  - name: "Marqeta"
    note: "marqeta/marqeta-openapi has real specs (yaml/CoreAPI-3.0.40.yaml, 324 paths, 424 ops, 1.86 MB) but each release is a new numbered file (CoreAPI-3.0.1 ... 3.0.40), so there is no stable path and no per-file history."
  - name: "Avalara AvaTax"
    note: "Avalara/Swagger and the usual spec URLs 404; repo layout changed and no verified current spec found."
  - name: "Amadeus"
    note: "amadeus4dev/amadeus-open-api-specification is real (Swagger 2.0, one file per API) but the org is marked DEPRECATED, Self-Service portal reportedly decommissioned July 2026, and files are stale (Flight Offers Search last touched 2024-03)."
  - name: "Booking.com"
    note: "Not checked in detail: partner API is behind login, no public spec known."
  - name: "Bill.com"
    note: "Not checked in detail: no public spec repo known."
  - name: "Groq"
    note: "No published OpenAPI spec found: api.groq.com/openapi.json, console.groq.com/docs/*openapi* all 404; only third-party tryAGI/api-evangelist copies. OpenAI-compatible, so OpenAI spec roughly applies."
  - name: "Vultr"
    note: "Spec exists (SDK generated from www.vultr.com/api) but openapi.json URL returns 403 to curl (bot protection) and no repo copy found; vultr-python-client contains only generated code."
  - name: "Scaleway"
    note: "Dozens of per-product specs on developers.scaleway.com, no single file; only a third-party mirror (Plana-Solutions/spec-mirror-scaleway)."
  - name: "OVHcloud"
    note: "Swagger 1.2-style API listing at eu.api.ovh.com/v1/ (index of many per-service docs, no paths in a single OpenAPI 3/Swagger 2 file)."
  - name: "Railway"
    note: "GraphQL only (backboard.railway.com/graphql/v2)."
  - name: "Heroku"
    note: "Platform API described by a JSON Hyper-Schema (api.heroku.com/schema returned 400 without proper Accept header), not OpenAPI/Swagger."
  - name: "New Relic"
    note: "NerdGraph is GraphQL; REST v2 has no published OpenAPI file."
  - name: "Postman API"
    note: "No public OpenAPI file found (api.getpostman.com/openapi.json 404)."
  - name: "Mux"
    note: "Spec only embedded in docs text page (mux.com/docs/api-reference/data.txt, JSON in a markdown code fence, ~0.27 MB), not a downloadable OpenAPI file; no spec in muxinc repos (SDK .stats.yml has no URL)."
  - name: "Cloudinary"
    note: "No public OpenAPI spec found at the usual docs URLs or via search; SDK-only."
  - name: "Segment (Twilio Segment)"
    note: "Public API spec behind docs.segmentapis.com download; api.segmentapis.com/openapi.json returns 401; no repo copy (SDK repos are generated)."
  - name: "Contentful"
    note: "No official OpenAPI spec for CMA/CDA; only third-party api-evangelist copies."
  - name: "Sanity"
    note: "No published OpenAPI file found (HTTP API docs only; GROQ/GraphQL)."
  - name: "Strapi"
    note: "Self-hosted; spec generated per project by a plugin, no central public file."
  - name: "Fastly"
    note: "Official specs live in a private/unlocated repo; only third-party per-product copies (api-evangelist/fastly) and developer.fastly.com/reference/api/openapi.json 404."
  - name: "Terraform Cloud / HCP Terraform"
    note: "API docs are hand-written JSON:API pages; no OpenAPI file published."
  - name: "HashiCorp Vault"
    note: "OpenAPI is generated at runtime from a running server (/v1/sys/internal/specs/openapi), not a published file."
  - name: "Hasura"
    note: "GraphQL engine; no static REST OpenAPI spec (metadata API only documented in prose)."
  - name: "Snowflake REST"
    note: "Split into ~50 per-resource YAMLs in snowflakedb/snowflake-rest-api-specs/specifications (account.yaml, database.yaml, ...); no single file. Could add up to 3 if wanted (e.g. sqlapi.yaml)."
