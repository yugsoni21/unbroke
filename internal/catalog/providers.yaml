    note: "MessageBird/openapi-specs contains only small AI/SMS specs last touched 2022."
  - name: "Plivo"
    note: "No public OpenAPI file found."
  - name: "Bandwidth"
    note: "Bandwidth/api-specs (source of truth) is not public; Bandwidth/api-docs/site/specs is archived and untouched since Oct 2023."
