openapi: 3.0.3
info:
  title: Acme Payments
  version: "2026-06-01"
paths:
  /v1/charges:
    post:
      operationId: createCharge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, source]
              properties:
                amount: { type: integer }
                currency: { type: string }
                source: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
  /v1/refunds:
    post:
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charge]
              properties:
                charge: { type: string }
                amount: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
  /v1/customers/{id}:
    get:
      operationId: getCustomer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
  /v1/me:
    get:
      operationId: getCurrentCustomer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
  /v1/invoices:
    get:
      operationId: listInvoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, open, paid, uncollectible]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Invoice" }
  /v1/sources:
    get:
      operationId: listSources
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
components:
  schemas:
    Charge:
      type: object
      required: [id, amount]
      properties:
        id: { type: string }
        amount: { type: integer }
    Refund:
      type: object
      required: [id]
      properties:
        id: { type: string }
        amount: { type: integer }
        status: { type: string, enum: [pending, succeeded] }
    Customer:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
    Invoice:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string }
